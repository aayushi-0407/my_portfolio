<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        {% block page_style %}
        body { padding-top: 80px; }
        {% endblock %}
    </style>
</head>
<body>
    {% block navbar %}
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="{% url 'portfolio:home' %}">Portfolio</a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="{% url 'portfolio:home' %}" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'portfolio:education' %}" class="nav-link">Education</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'portfolio:projects' %}" class="nav-link">Projects</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'portfolio:experience' %}" class="nav-link">Experience</a>
                </li>
            </ul>
        </div>
    </nav>
    {% endblock %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
